# Audiobookshelf for TOS 7 — nginx 反代（WebUI External Open / 新标签页模式）
# 官方模板: help.terra-master.com → Deb Development Specification → Nginx Configuration
# 安装位置: /usr/local/audiobookshelf/nginx/audiobookshelf.conf
# 平台将其加载进 TOS nginx；location 前缀必须与 config.ini 的 path 一致
#
# 前缀保留模式（navidrome 先例）：proxy_pass 不带 URI 部分，/audiobookshelf/
# 前缀原样传递给后端——上游应用原生以 ROUTER_BASE_PATH=/audiobookshelf 提供
# 服务（v2.x 默认），Next.js 客户端资源、socket.io、RSS/分享链接的前缀全部
# 天然一致，零适配
location /audiobookshelf/ {
    proxy_pass http://127.0.0.1:13378;
    # 301 重定向不丢端口（TOS web 端口 8181 非标准，坑 13）
    absolute_redirect off;
    proxy_http_version 1.1;
    # 应用会生成绝对 URL（封面、RSS、分享链接），Host 必须带端口（坑 14）
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket 升级（socket.io 实时推送必需）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # 有声书播放为长连接大流量，超时放宽
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 大库封面/音频响应缓冲
    proxy_buffering off;
}

# 隐私政策精确路由（坑 45 C3 合规：应用内可被用户/审核员发现的入口；
# 精确匹配优先于上方前缀反代，静态直出，不经后端）
location = /audiobookshelf/privacy-policy.html {
    alias /usr/local/audiobookshelf/privacy-policy.html;
    default_type text/html;
    absolute_redirect off;
    access_log off;
}
