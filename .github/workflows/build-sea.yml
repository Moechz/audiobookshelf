# SEA 自建 CI（V6 整改核心，D-015；arm64 扩展 D-016）
#
# 目的：商店 V6 一票否决项——"包内不得携带无审计来源的预编译 ELF"。
# 即使上游官方发布的二进制直接打包也会被拒（sftpgo/beszel 先例，指南坑 32）。
# 本 workflow 从上游源码复刻官方 build/linuxpackager 配方自建 SEA 单文件：
#   1. 锁上游 tag 源码归档（sha256）
#   2. 锁 Node 工具链版本
#   3. npm ci（package-lock 锁定）→ Nuxt 前端 generate → pkg 打包
#   4. 连续两次构建哈希互证（可复现性自证，写入 release notes）
#   5. 产物发布到 build-v<版本> Release（含 SHA256SUMS-<arch>）
#
# 双架构：x86_64（ubuntu-22.04）+ arm64（ubuntu-24.04-arm 原生 runner）。
# 上游官方 PPA 仅 amd64（Architecture: amd64 实测）；arm64 为本仓源码
# 自建扩展（同源码同配方，仅 pkg target 不同），审计链说明见 PROVENANCE。
# 注意 arm64 的 node20 fetch binary 要求 glibc >= 2.35（Ubuntu 22.04），
# 恰为 TOS 7 基座，产物可运行。
#
# pkg-fetch 拉取的 node fetch binary 是唯一外部预编译物：
# 其 sha256 随构建日志输出并记入 PROVENANCE.md（官方源 + 锁哈希）。
# 工具链注：上游 linuxpackager 未锁 pkg 版本；vercel/pkg 5.1.1 的
# pkg-fetch 不支持 node20 target，采用社区维护 fork @yao-pkg/pkg@5.16.1
# （pkg-fetch 3.6.5，支持 node20，x64/arm64 双平台）。
#
# 触发：手动（workflow_dispatch）或打 v* tag。
# 用法：Actions 页手动触发 → 填上游版本号（如 2.36.0）与 arch（all/x86_64/arm64）
#   → 跑完把 Release 里对应架构 SEA 的 sha256 回填 config.env 的
#   SEA_SOURCE_SHA256_{AMD64,ARM64}，然后 BUILD_MODE=source ./build.sh。

name: build-sea

on:
  workflow_dispatch:
    inputs:
      abs_version:
        description: 'Upstream version (e.g. 2.36.0)'
        required: true
      arch:
        description: 'Build architecture (all, x86_64, arm64)'
        required: false
        default: 'all'
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NODE_VERSION: '20.11.1'

jobs:
  build-x86_64:
    if: ${{ github.event_name == 'push' || inputs.arch == 'all' || inputs.arch == 'x86_64' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Pin upstream source
        env:
          ABS_VERSION: ${{ inputs.abs_version || github.ref_name }}
        run: |
          set -euo pipefail
          echo "ABS_VERSION=${ABS_VERSION#v}" >> "$GITHUB_ENV"
          curl -fL --retry 5 -o src.tar.gz \
            "https://github.com/advplyr/audiobookshelf/archive/refs/tags/v${ABS_VERSION#v}.tar.gz"
          echo "SRC_SHA256=$(sha256sum src.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build SEA (replicating upstream build/linuxpackager)
        run: |
          set -euo pipefail
          mkdir -p work && tar -xzf src.tar.gz -C work --strip-components=1
          cd work
          cd client
          rm -rf node_modules
          npm ci --unsafe-perm=true --allow-root
          npm run generate
          cd ..
          rm -rf node_modules
          npm ci --unsafe-perm=true --allow-root
          npx --yes @yao-pkg/pkg@5.16.1 -t node20-linux-x64 -o ../audiobookshelf-sea-x86_64 .
          cd ..
          chmod 0755 audiobookshelf-sea-x86_64
          file audiobookshelf-sea-x86_64
          find ~/.cache/pkg-cache -name 'fetched-v*' -exec sha256sum {} \; || true
          echo "SEA_SHA256=$(sha256sum audiobookshelf-sea-x86_64 | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Reproducibility self-check (second build)
        run: |
          set -euo pipefail
          cd work
          rm -rf client/node_modules node_modules
          cd client && npm ci --unsafe-perm=true --allow-root && cd ..
          npm ci --unsafe-perm=true --allow-root
          npx --yes @yao-pkg/pkg@5.16.1 -t node20-linux-x64 -o ../audiobookshelf-sea-2nd .
          cd ..
          h1=$(sha256sum audiobookshelf-sea-x86_64 | cut -d' ' -f1)
          h2=$(sha256sum audiobookshelf-sea-2nd | cut -d' ' -f1)
          echo "build1=$h1"; echo "build2=$h2"
          rm -f audiobookshelf-sea-2nd
          [ "$h1" = "$h2" ] && echo "REPRO=identical" >> "$GITHUB_ENV" || echo "REPRO=differs" >> "$GITHUB_ENV"

      - name: Publish to Release (build-v<version>)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha256sum audiobookshelf-sea-x86_64 > SHA256SUMS-x86_64
          gh release create -R Moechz/audiobookshelf "build-v${ABS_VERSION}" \
            audiobookshelf-sea-x86_64 SHA256SUMS-x86_64 \
            --title "SEA build v${ABS_VERSION}" \
            --notes "Built from upstream tag v${ABS_VERSION} (src sha256: ${SRC_SHA256}) with Node ${NODE_VERSION}, replicating upstream build/linuxpackager. Reproducibility: ${REPRO}. pkg fetch-binary sha256 listed in workflow log / PROVENANCE.md." \
            || gh release upload -R Moechz/audiobookshelf "build-v${ABS_VERSION}" audiobookshelf-sea-x86_64 SHA256SUMS-x86_64 --clobber

  build-arm64:
    if: ${{ github.event_name == 'push' || inputs.arch == 'all' || inputs.arch == 'arm64' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Pin upstream source
        env:
          ABS_VERSION: ${{ inputs.abs_version || github.ref_name }}
        run: |
          set -euo pipefail
          echo "ABS_VERSION=${ABS_VERSION#v}" >> "$GITHUB_ENV"
          curl -fL --retry 5 -o src.tar.gz \
            "https://github.com/advplyr/audiobookshelf/archive/refs/tags/v${ABS_VERSION#v}.tar.gz"
          echo "SRC_SHA256=$(sha256sum src.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build SEA (replicating upstream build/linuxpackager)
        run: |
          set -euo pipefail
          mkdir -p work && tar -xzf src.tar.gz -C work --strip-components=1
          cd work
          cd client
          rm -rf node_modules
          npm ci --unsafe-perm=true --allow-root
          npm run generate
          cd ..
          rm -rf node_modules
          npm ci --unsafe-perm=true --allow-root
          npx --yes @yao-pkg/pkg@5.16.1 -t node20-linux-arm64 -o ../audiobookshelf-sea-arm64 .
          cd ..
          chmod 0755 audiobookshelf-sea-arm64
          file audiobookshelf-sea-arm64
          find ~/.cache/pkg-cache -name 'fetched-v*' -exec sha256sum {} \; || true
          echo "SEA_SHA256=$(sha256sum audiobookshelf-sea-arm64 | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Reproducibility self-check (second build)
        run: |
          set -euo pipefail
          cd work
          rm -rf client/node_modules node_modules
          cd client && npm ci --unsafe-perm=true --allow-root && cd ..
          npm ci --unsafe-perm=true --allow-root
          npx --yes @yao-pkg/pkg@5.16.1 -t node20-linux-arm64 -o ../audiobookshelf-sea-2nd .
          cd ..
          h1=$(sha256sum audiobookshelf-sea-arm64 | cut -d' ' -f1)
          h2=$(sha256sum audiobookshelf-sea-2nd | cut -d' ' -f1)
          echo "build1=$h1"; echo "build2=$h2"
          rm -f audiobookshelf-sea-2nd
          [ "$h1" = "$h2" ] && echo "REPRO=identical" >> "$GITHUB_ENV" || echo "REPRO=differs" >> "$GITHUB_ENV"

      - name: Publish to Release (build-v<version>)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha256sum audiobookshelf-sea-arm64 > SHA256SUMS-arm64
          gh release create -R Moechz/audiobookshelf "build-v${ABS_VERSION}" \
            audiobookshelf-sea-arm64 SHA256SUMS-arm64 \
            --title "SEA build v${ABS_VERSION}" \
            --notes "Built from upstream tag v${ABS_VERSION} (src sha256: ${SRC_SHA256}) with Node ${NODE_VERSION}, replicating upstream build/linuxpackager. Reproducibility: ${REPRO}. pkg fetch-binary sha256 listed in workflow log / PROVENANCE.md." \
            || gh release upload -R Moechz/audiobookshelf "build-v${ABS_VERSION}" audiobookshelf-sea-arm64 SHA256SUMS-arm64 --clobber
